apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab36-prod
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-lab36-prod
  template:
    metadata:
      labels:
        app: minterjt-lab36-prod
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest                             #<----change this!
        ports:
        - containerPort: 80  # Expose NGINX on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-prod-service
spec:
  type: LoadBalancer
  loadBalancerIP: PRODUCTION_IP                                    # <-----change this!!!!
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: minterjt-lab36-prod
